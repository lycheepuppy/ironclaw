[advisories]
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Pre-existing advisories — tracked for upgrade in separate PRs
    # serde_yml unsound/unmaintained — direct dep, upgrade tracked separately
    "RUSTSEC-2025-0068",
    # tokio-tar PAX header parsing — sandbox containers only
    "RUSTSEC-2025-0111",
    # wasmtime fd_renumber host panic — WASIp1, mitigated by fuel limits
    "RUSTSEC-2025-0046",
    # wasmtime shared linear memory unsoundness — no shared memory in our guests
    "RUSTSEC-2025-0118",
    # wasmtime guest-controlled resource exhaustion — mitigated by fuel/memory limits
    "RUSTSEC-2026-0020",
    # wasmtime wasi:http/types.fields panic — mitigated by fuel limits
    "RUSTSEC-2026-0021",
    # rustls-webpki CRL distributionPoint matching — 0.102.8 pinned by libsql transitive dep
    "RUSTSEC-2026-0049",
    # ring AES overflow-check panic — only triggers with overflow-checks enabled (off in release);
    # ring 0.16.20 pinned by ethers-rs transitive dep (ethers-rs is deprecated, can't upgrade)
    "RUSTSEC-2025-0009",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"

[[licenses.clarify]]
name = "ring"
version = "0.16.20"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # walletconnect-client fork with native tokio transport (PR #1759)
    "https://github.com/zmanian/walletconnect-client.git",
]
